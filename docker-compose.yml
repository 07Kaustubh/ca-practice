# This base file publishes NO ports at all. Dolibarr, MariaDB and the cron
# container are reachable only on the compose network. The dev overlay adds
# 127.0.0.1 bindings; the prod overlay puts Caddy in front on 80/443.
# Do NOT add a 0.0.0.0 binding here: Docker's iptables rules bypass ufw, so a
# published port is internet-reachable regardless of the firewall. The
# DOCKER-USER rule in bootstrap-vps.sh is the backstop, not the primary control.
services:
  db:
    # MariaDB defaulted to UTC while PHP runs Asia/Kolkata, so every row created
    # by the app (datec, IST) was stamped `tms` by the DB 5h30m EARLIER - records
    # appeared "modified before they were created" in the audit trail.
    command: ["--default-time-zone=+05:30"]
    image: mariadb@sha256:2d2f4095530294735a857cfe22bb101e19b0849b416911c796ec4aa81b164a62   # was mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set in secrets.env}
      MARIADB_DATABASE: dolibarr
      MARIADB_USER: dolibarr
      MARIADB_PASSWORD: ${DB_PASSWORD:?set in secrets.env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 40
  dolibarr:
    image: dolibarr/dolibarr@sha256:69ec52e3b7ef54a37a8bd08feed9010270be0d04d86cefb3a569acd587379e6c   # was dolibarr/dolibarr:latest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DOLI_DB_HOST: db
      DOLI_DB_NAME: dolibarr
      DOLI_DB_USER: dolibarr
      DOLI_DB_PASSWORD: ${DB_PASSWORD:?set in secrets.env}
      DOLI_ADMIN_LOGIN: admin
      DOLI_ADMIN_PASSWORD: ${DOLI_ADMIN_PASSWORD:?set in secrets.env}
      DOLI_URL_ROOT: ${DOLI_URL_ROOT:-http://localhost:8080}
      DOLI_CRON: 0
      PHP_INI_DATE_TIMEZONE: 'Asia/Kolkata'
    volumes:
      - doli_docs:/var/www/documents
      - doli_html:/var/www/html/custom

  # Dedicated cron container - the image's own pattern. DOLI_CRON=1 installs
  # /etc/cron.d/dolibarr (*/5) AND skips the install path (docker-run.sh:343),
  # so it will not race the web container's schema setup. Do NOT override
  # entrypoint here: that bypasses the script that writes conf.php.
  dolibarr-cron:
    image: dolibarr/dolibarr@sha256:69ec52e3b7ef54a37a8bd08feed9010270be0d04d86cefb3a569acd587379e6c   # was dolibarr/dolibarr:latest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      dolibarr: { condition: service_started }
    environment:
      DOLI_DB_HOST: db
      DOLI_DB_NAME: dolibarr
      DOLI_DB_USER: dolibarr
      DOLI_DB_PASSWORD: ${DB_PASSWORD:?set in secrets.env}
      DOLI_URL_ROOT: ${DOLI_URL_ROOT:-http://localhost:8080}
      DOLI_CRON: 1
      DOLI_CRON_KEY: ${CA_CRON_KEY:?set in secrets.env}
      DOLI_CRON_USER: admin
      PHP_INI_DATE_TIMEZONE: 'Asia/Kolkata'
    volumes:
      - doli_docs:/var/www/documents
      - doli_html:/var/www/html/custom

volumes:
  db_data:      # MariaDB data. Without this the client list dies on `compose down`.
  doli_docs:    # Uploaded filings/PDFs. The CA's actual archive.
  doli_html:    # Custom modules.
